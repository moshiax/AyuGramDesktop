name: Windows x64

on:
  push:
    branches:
      - dev
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-2022
    timeout-minutes: 360

    defaults:
      run:
        shell: cmd

    env:
      TBUILD: ${{ github.workspace }}\TBuild
      GYP_MSVS_OVERRIDE_PATH: 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\'
      GYP_MSVS_VERSION: 2022
      SCCACHE_GHA_ENABLED: "true"

    steps:
      - name: Remove bullshit
        shell: pwsh
        run: |
          $patterns = 'Android|dotnet|Miniconda|msys64|\.cargo|ghcup|cabal|LLVM|vcpkg|kotlinc|php|Apache24|nginx|selenium|R\\|rtools|Chrome|Firefox|PostgreSQL|MongoDB|MySQL|Docker|Go\\bin|Ruby|PyPy|Java_|NuGet'

          foreach ($scope in 'Machine', 'User') {
            $path = [Environment]::GetEnvironmentVariable('Path', $scope)
            $clean = ($path -split ';' | Where-Object {
              $_ -and $_ -notmatch $patterns
            }) -join ';'

            [Environment]::SetEnvironmentVariable('Path', $clean, $scope)
          }

          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')

      - name: Prepare directories
        run: |
          mkdir "%TBUILD%\Libraries"
          mkdir "%TBUILD%\ThirdParty"

      - name: Checkout AyuGram
        uses: actions/checkout@v7
        with:
          submodules: recursive
          path: TBuild/AyuGramDesktop
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1.12.0
        with:
          arch: x64
          sdk: 10.0.26100.0

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Restore ThirdParty cache
        id: cache-thirdparty
        uses: actions/cache/restore@v6
        with:
          path: TBuild/ThirdParty
          key: windows-x64-msvc-14.42-thirdparty-${{ hashFiles('TBuild/AyuGramDesktop/Telegram/build/prepare/prepare.py', 'TBuild/AyuGramDesktop/Telegram/build/qt_version.py') }}
          restore-keys: |
            windows-x64-msvc-14.42-thirdparty-

      - name: Restore Libraries cache
        id: cache-libraries
        uses: actions/cache/restore@v6
        with:
          path: TBuild/Libraries
          key: windows-x64-msvc-14.42-libraries-${{ hashFiles('TBuild/AyuGramDesktop/Telegram/build/prepare/prepare.py', 'TBuild/AyuGramDesktop/Telegram/build/qt_version.py') }}
          restore-keys: |
            windows-x64-msvc-14.42-libraries-

      - name: Prepare libraries
        env:
          GYP_MSVS_OVERRIDE_PATH: 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\'
          GYP_MSVS_VERSION: 2022
        run: |
          set CARGO_INCREMENTAL=0
          TBuild\AyuGramDesktop\Telegram\build\prepare\win.bat silent

      - name: Save ThirdParty cache
        if: steps.cache-thirdparty.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: TBuild/ThirdParty
          key: windows-x64-msvc-14.42-thirdparty-${{ hashFiles('TBuild/AyuGramDesktop/Telegram/build/prepare/prepare.py', 'TBuild/AyuGramDesktop/Telegram/build/qt_version.py') }}

      - name: Save Libraries cache
        if: steps.cache-libraries.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: TBuild/Libraries
          key: windows-x64-msvc-14.42-libraries-${{ hashFiles('TBuild/AyuGramDesktop/Telegram/build/prepare/prepare.py', 'TBuild/AyuGramDesktop/Telegram/build/qt_version.py') }}

      - name: Configure
        run: |
          cd /d TBuild\AyuGramDesktop\Telegram

          call configure.bat x64 ^
            -D TDESKTOP_API_ID=2040 ^
            -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627 ^
            -D CMAKE_CONFIGURATION_TYPES=Release ^
            -D DESKTOP_APP_NO_PDB=ON ^
            -D CMAKE_C_COMPILER_LAUNCHER=sccache ^
            -D CMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build
        run: |
          cd /d TBuild\AyuGramDesktop\Telegram
          cmake --build ..\out --config Release --parallel

      - name: Show sccache stats
        run: sccache --show-stats

      - name: Package build
        shell: pwsh
        run: |
          $out = "TBuild/AyuGramDesktop/out/Release"
          $artifact = "artifact"

          if (!(Test-Path $out)) {
            throw "Release output directory not found: $out"
          }

          $exe = Join-Path $out "AyuGram.exe"

          if (!(Test-Path $exe)) {
            Get-ChildItem $out -Recurse
            throw "AyuGram.exe not found!"
          }

          New-Item -ItemType Directory -Force $artifact | Out-Null

          Copy-Item "$out/*" $artifact -Recurse -Force

          Compress-Archive -Path "$artifact/*" `
            -DestinationPath "AyuGram-win64.zip" -Force

      - name: Update nightly tag
        if: github.ref == 'refs/heads/dev'
        working-directory: TBuild/AyuGramDesktop
        run: |
          git tag -f nightly %GITHUB_SHA%
          git push origin refs/tags/nightly --force

      - name: Publish nightly release
        if: github.ref == 'refs/heads/dev'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: AyuGram Nightly
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: AyuGram-win64.zip
          body: |
            Automatic Windows x64 build from the dev branch.

            Commit: ${{ github.sha }}

      - name: Publish version release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AyuGram ${{ github.ref_name }}
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: AyuGram-win64.zip
